name: CI

on:
  push:
    branches: [ "master", "main", "add-nix-flake" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Verify Nix Flake
        run: nix flake check

      - name: Build Neovim Environment
        run: nix build .

      - name: Symlink Configuration to Standard Path
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim

      - name: Headless Plugin Sync & Health Check
        run: |
          nix run . -- --headless "+Lazy! sync" +qa
          nix run . -- --headless "+checkhealth" +qa
